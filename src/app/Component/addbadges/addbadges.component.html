<div class="container-fluid g-0">
  <app-dash-header></app-dash-header>
  <main>
    <div [ngClass]="{'display-area-shrink': sideNavStatus}" class="display-area p-3">
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="">Home</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">
            <a>Badge</a>
          </li>
        </ol>
      </nav>

      <!-- Badge Creation Form -->
      <div class="container">
        <div class="card shadow p-4 mb-4">
          <h2 class="text-center mb-4">Create Badge</h2>
          <form [formGroup]="badgeForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Badge Name</label>
                <input
                  formControlName="name"
                  type="text"
                  id="name"
                  class="form-control"
                  placeholder="Enter badge name"
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  formControlName="description"
                  id="description"
                  class="form-control"
                  rows="2"
                  placeholder="Enter description"
                ></textarea>
              </div>

              <div class="col-md-6 mb-3">
                <label for="icon" class="form-label">Select Icon</label>
                <select formControlName="icon" id="icon" class="form-select">
                  <option *ngFor="let icon of availableIcons" [value]="icon">
                    {{ icon }}
                  </option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="backgroundColor" class="form-label">Select Background Color</label>
                <input
                  formControlName="backgroundColor"
                  type="color"
                  id="backgroundColor"
                  class="form-control form-control-color"
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="rule" class="form-label">Rule</label>
                <select formControlName="rule" id="rule" class="form-select">
                  <option *ngFor="let rule of badgeRules" [value]="rule">
                    {{ rule }}
                  </option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="threshold" class="form-label">Threshold</label>
                <input
                  formControlName="threshold"
                  type="number"
                  id="threshold"
                  class="form-control"
                  placeholder="Enter threshold value"
                />
              </div>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary" [disabled]="badgeForm.invalid">
                Create Badge
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Badge Tabs -->
      <div class="badge-container">
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item">
            <button class="nav-link" [ngClass]="{ active: activeTab === 'all' }" (click)="search('all')">
              All Badges
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" [ngClass]="{ active: activeTab === 'myBadges' }" (click)="search('myBadges')">
              My Badges
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" [ngClass]="{ active: activeTab === 'xp' }" (click)="search('xp')">
              XP Based
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" [ngClass]="{ active: activeTab === 'task' }" (click)="search('task')">
              Task Completion
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" [ngClass]="{ active: activeTab === 'course' }" (click)="search('course')">
              Course Completion
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" [ngClass]="{ active: activeTab === 'time' }" (click)="search('time')">
              Time Completion
            </button>
          </li>
        </ul>

        <!-- Badge Content -->
        <div class="tab-content">
          <div *ngFor="let tab of ['all', 'myBadges', 'xp', 'task', 'course', 'time']" class="tab-pane" [ngClass]="{ active: activeTab === tab }">
            <h3 class="text-center">{{ tab | titlecase }} Badges</h3>
            <div class="row mt-4">
              <div *ngFor="let badge of badges" class="col-6 col-md-3 mb-3">
                <div class="card text-center shadow-sm p-3">
                  <div class="badge-preview mx-auto" [ngStyle]="{ 'background-color': badge.backgroundColor }">
                    <i class="bi" [ngClass]="badge.icon"></i>
                  </div>
                  <h5 class="mt-2">{{ badge.name }}</h5>
                  <p class="text-muted mb-1">{{ badge.rule }}</p>
                  <p class="text-muted small">Threshold: {{ badge.threshold }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
