<div class="container mt-4">
    <h2>Select Questions for Quiz</h2>
    <div class="question-list mt-3">
      <div *ngFor="let question of questionBank" class="card mb-2">
        <div class="card-body">
          <input
            type="checkbox"
            [checked]="selectedQuestions.includes(question)"
            (change)="toggleQuestionSelection(question)"
          />
          <strong>{{ question.question }}</strong>
          <p *ngFor="let option of question.options">{{ option }}</p>
          <small>Level: {{ question.level }}</small>
        </div>
      </div>
    </div>
  
    <button class="btn btn-primary" (click)="saveQuiz()">Save Quiz</button>
  </div>
