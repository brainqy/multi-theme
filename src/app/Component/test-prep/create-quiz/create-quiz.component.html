<div class="container mt-4">
    <h2>Create New Quiz</h2>
    <form (ngSubmit)="onSubmit()" #quizForm="ngForm" class="mt-3">
      <div class="form-group mb-3">
        <label for="subject">Subject</label>
        <input
          type="text"
          id="subject"
          class="form-control"
          required
          [(ngModel)]="quiz.subject"
          name="subject"
          #subject="ngModel"
        />
      </div>
  
      <div class="form-group mb-3">
        <label for="numberOfQuestions">Number of Questions</label>
        <input
          type="number"
          id="numberOfQuestions"
          class="form-control"
          required
          [(ngModel)]="quiz.numberOfQuestions"
          name="numberOfQuestions"
          #numberOfQuestions="ngModel"
        />
      </div>
  
      <div class="form-group mb-3">
        <label for="time">Time (in minutes)</label>
        <input
          type="number"
          id="time"
          class="form-control"
          required
          [(ngModel)]="quiz.time"
          name="time"
          #time="ngModel"
        />
      </div>
  
      <div class="form-group mb-3">
        <label for="level">Difficulty Level</label>
        <select
          id="level"
          class="form-control"
          required
          [(ngModel)]="quiz.level"
          name="level"
          #level="ngModel"
        >
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
  
      <div class="form-group mb-3">
        <label for="attempts">Number of Attempts</label>
        <input
          type="number"
          id="attempts"
          class="form-control"
          required
          [(ngModel)]="quiz.attempts"
          name="attempts"
          #attempts="ngModel"
        />
      </div>
      <button type="button" class="btn btn-primary" (click)="goToSelectQuestions()">Next</button>

      <button type="submit" class="btn btn-primary" [disabled]="quizForm.invalid">Save Quiz</button>
    </form>
  </div>
