<div class="container-fluid g-0">
    <app-dash-header></app-dash-header>
    <main>
      <div [ngClass]="{'display-area-shrink':sideNavStatus}" class="display-area p-3">
  
<div class="p-3">
    <!-- Breadcrumb navigation -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="">Home</a></li>
        <li class="breadcrumb-item"><a href="quiz-store">Quiz Store</a></li> <!-- Link to forum homepage -->
             </ol>
    </nav>

    <div class="container mt-4">
        <!-- Filter and Create Button Row -->
        <div class="row mb-3 align-items-center">
          <div class="col-md-4">
            <input
              type="text"
              class="form-control"
              placeholder="Filter by Subject"
              [(ngModel)]="filterText"
              (input)="filterQuizzes()"
            />
          </div>
          <div class="col text-right">
            <button class="btn btn-success" (click)="createQuiz()">Create Quiz</button>
          </div>
        </div>
      
        <!-- Quiz Cards -->
        <div class="row">
          <div class="col-md-4 mb-4" *ngFor="let quiz of filteredQuizzes">
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title">{{ quiz.subject }}</h5>
                <p class="card-text">
                  <strong>Difficulty:</strong> {{ quiz.level }}<br>
                  <strong>Questions:</strong> {{ quiz.numberOfQuestions }}<br>
                  <strong>Time:</strong> {{ quiz.time }} mins<br>
                  <strong>Attempts:</strong> {{ quiz.attempts }}
                </p>
                <button class="btn btn-primary btn-sm mt-3 w-100" [routerLink]="['/quiz-test', quiz.quizId]">Start Quiz</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      
</div>
      </div>
    </main>
</div>
