name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - dev-dnyanesh
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
        env:
          FIREBASE_BRAINQ_API_KEY: ${{ secrets.FIREBASE_BRAINQ_API_KEY }}
      - run: |
          echo "FIREBASE_BRAINQ_API_KEY=${{ secrets.FIREBASE_BRAINQ_API_KEY }}" >> .env
          npm run build --prod
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CITYGUIDE_F5ED9 }}'
          channelId: live
          projectId: cityguide-f5ed9
